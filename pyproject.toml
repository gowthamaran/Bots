[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-lp-bot"
version = "0.1.0"
description = "Modular Polymarket liquidity rewards market-making bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10",
  "httpx>=0.27",
  "loguru>=0.7",
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "py-clob-client-v2>=0.1.0",
  "python-dotenv>=1.0",
  "python-telegram-bot>=21.0",
  "pyyaml>=6.0",
  "tenacity>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
polymarket-lp-bot = "polymarket_lp_bot.main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
